<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />

<header class="navbar">
  <div class="nav-left">
    <button class="menu-btn" (click)="toggleSidebar($event)">
      <span class="material-icons">menu</span>
    </button>
    <h2 class="logo">MESS <span>NOVA</span></h2>
  </div>

  <div class="nav-right" *ngIf="showAuthButtons">
    <button class="login-btn" routerLink="/login">Login</button>
    <button class="signup-btn" routerLink="/signup">Sign Up</button>
  </div>
</header>

<div class="sidebar" [class.active]="isSidebarOpen">
  <div class="sidebar-header" *ngIf="isLoggedIn">
    <span class="material-icons sidebar-logo">restaurant</span>
    <h3>{{ role | titlecase }} Panel</h3>
  </div>

  <nav class="sidebar-nav">
    <a
      *ngFor="let item of currentMenuItems"
      class="nav-link"
      [routerLink]="getMenuRoute(item)"
      [queryParams]="getMenuQueryParams(item)"
      [class.active]="activeSection === item.section"
      (click)="onMenuClick(item)"
    >
      <span class="material-icons">{{ item.icon }}</span>
      {{ item.label }}
    </a>
  </nav>

  <div class="sidebar-footer" *ngIf="isLoggedIn">
    <button class="logout-sidebar-btn" (click)="logout()">
      <span class="material-icons">logout</span>
      Logout
    </button>
  </div>
</div>

<div *ngIf="isSidebarOpen" class="overlay" (click)="onOverlayClick()"></div>
